name: Build and Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Test Docker build
        run: |
          docker build -t bpr-backend:test .

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT }}
          script: |
            echo "Starting deployment..."
            
            # Navigate to project directory
            cd ~/BPR-BackEnd || exit 1
            
            # Pull latest changes
            echo "Pulling latest code from main branch..."
            git pull origin main
            
            # Stop running containers
            echo "Stopping existing containers..."
            docker-compose down
            
            # Remove old images to free up space
            echo "Cleaning up old Docker images..."
            docker system prune -f
            
            # Build and start containers
            echo "Building and starting containers..."
            docker-compose up -d --build
            
            # Wait for services to be healthy
            echo "Waiting for services to start..."
            sleep 15
            
            # Check container status
            echo "Container status:"
            docker-compose ps
            
            # Show recent logs
            echo "Recent logs:"
            docker-compose logs --tail=50
      
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_PORT }}
          script: |
            echo "Running health check..."
            
            # Wait a bit more for the service to be fully ready
            sleep 10
            
            # Check if backend is responding
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed! Backend is running."
              curl -s http://localhost:5000/health | jq '.'
            else
              echo "❌ Health check failed! Backend returned status: $RESPONSE"
              echo "Showing container logs:"
              docker-compose logs --tail=100
              exit 1
            fi
      
      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi