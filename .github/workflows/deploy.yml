name: Build and Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Test Docker build
        run: |
          docker build -t bpr-backend:test .

  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bpr-backend:latest
            ghcr.io/${{ github.repository_owner }}/bpr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname ssh.bachelorproject26.site" \
              -i ~/.ssh/id_rsa \
              ${{ secrets.PI_USERNAME }}@ssh.bachelorproject26.site << 'EOF'
            cd ~/BachelorApi/BPR-BackEnd-API
            git pull origin main
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d --no-build
            sleep 20
            docker compose -f docker-compose.prod.yml ps
          EOF
      
      - name: Health Check
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname ssh.bachelorproject26.site" \
              -i ~/.ssh/id_rsa \
              ${{ secrets.PI_USERNAME }}@ssh.bachelorproject26.site << 'EOF'
            if docker exec bpr-flask curl -f http://localhost:5000/health; then
              echo "✅ Backend health check passed!"
            else
              echo "❌ Backend health check failed!"
              docker logs bpr-flask --tail=50
              exit 1
            fi
            
            if curl -f https://test.bachelorproject26.site/health; then
              echo "✅ Public API health check passed!"
            else
              echo "❌ Public API health check failed!"
              docker logs bpr-cloudflared --tail=50
              exit 1
            fi
          EOF
      
      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "API available at: https://test.bachelorproject26.site"
          else
            echo "❌ Deployment failed!"
          fi