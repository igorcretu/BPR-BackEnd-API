name: Build and Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=10
        env:
          DATABASE_URL: sqlite:///./test.db
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
      
      - name: Test Docker build
        run: |
          docker build -t bpr-backend:test .

  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bpr-backend:latest
            ghcr.io/${{ github.repository_owner }}/bpr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/pi_deploy
          chmod 600 ~/.ssh/pi_deploy
          
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/pi_deploy \
              -o ProxyCommand="cloudflared access tcp --hostname ssh.bachelorproject26.site" \
              ${{ secrets.PI_USERNAME }}@ssh.bachelorproject26.site << 'EOF'
            cd ~/BachelorApi/BPR-BackEnd-API
            
            # Pull latest API code
            echo "📥 Pulling latest API code..."
            git pull origin main
            
            # Pull latest ML_Model code (scraper)
            echo "📥 Pulling latest ML_Model code..."
            cd ~/BachelorApi/BPR-BackEnd-ML-Model
            git pull origin main
            cd ~/BachelorApi/BPR-BackEnd-API
            
            # Pull latest Docker image
            echo "🐳 Pulling latest Docker image..."
            docker compose -f docker-compose.prod.yml pull backend
            
            # Start services
            echo "🚀 Starting services..."
            docker compose -f docker-compose.prod.yml up -d --no-build
            sleep 20
            
            # Run database migration
            echo "🗄️  Running database migration..."
            docker exec bpr-flask python run_migration.py || echo "⚠️  Migration may have already been applied"
            
            # Check ML model status
            echo "🤖 Checking ML model status..."
            docker exec bpr-flask python check_models.py || true
            
            docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Wait for service to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30  # Increase from ~10 to 30 seconds
      
      - name: Health Check
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/pi_deploy \
              -o ProxyCommand="cloudflared access ssh --hostname ssh.bachelorproject26.site" \
              ${{ secrets.PI_USERNAME }}@ssh.bachelorproject26.site << 'EOF'
            # Wait for Gunicorn to fully start
            echo "Waiting for backend to start..."
            sleep 30
            
            # Internal health check with retries
            max_attempts=10
            attempt=0
            while [ $attempt -lt $max_attempts ]; do
              if docker exec bpr-flask curl -f http://localhost:5000/health; then
                echo "✅ Backend health check passed!"
                break
              fi
              echo "Attempt $((attempt+1))/$max_attempts failed, retrying in 10s..."
              sleep 10
              attempt=$((attempt+1))
              if [ $attempt -eq $max_attempts ]; then
                echo "❌ Backend health check failed!"
                docker logs bpr-flask --tail=50
                exit 1
              fi
            done
            
            # Public API check with retries
            attempt=0
            while [ $attempt -lt $max_attempts ]; do
              if curl -f https://test.bachelorproject26.site/health; then
                echo "✅ Public API health check passed!"
                break
              fi
              echo "Attempt $((attempt+1))/$max_attempts failed, retrying in 10s..."
              sleep 10
              attempt=$((attempt+1))
              if [ $attempt -eq $max_attempts ]; then
                echo "❌ Public API health check failed!"
                docker logs bpr-cloudflared --tail=50
                exit 1
              fi
            done
          EOF


      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "API available at: https://test.bachelorproject26.site"
          else
            echo "❌ Deployment failed!"
          fi