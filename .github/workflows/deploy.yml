name: Build and Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Test Docker build
        run: |
          docker build -t bpr-backend:test .

  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/igorcretu/bpr-backend:latest
            ghcr.io/igorcretu/bpr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Deploy to Raspberry Pi via Cloudflare Tunnel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.bachelorproject26.site
          username: ${{ secrets.PI_USERNAME }}
          password: ${{ secrets.PI_PASSWORD }}
          proxy_command: cloudflared access ssh --hostname ssh.bachelorproject26.site
          script: |
            echo "Starting deployment..."
            
            # Navigate to project directory
            cd ~/BachelorApi/BPR-BackEnd-API || exit 1
            
            # Pull latest changes
            echo "Pulling latest code..."
            git pull origin main
            
            # Pull latest Docker image
            echo "Pulling latest Docker image..."
            docker compose -f docker-compose.prod.yml pull backend
            
            # Restart services
            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --no-build
            
            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 20
            
            # Show status
            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps
      
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.bachelorproject26.site
          username: ${{ secrets.PI_USERNAME }}
          password: ${{ secrets.PI_PASSWORD }}
          proxy_command: cloudflared access ssh --hostname ssh.bachelorproject26.site
          script: |
            echo "Running health check..."
            
            # Check backend health
            if docker exec bpr-flask curl -f http://localhost:5000/health; then
              echo "✅ Backend health check passed!"
            else
              echo "❌ Backend health check failed!"
              docker logs bpr-flask --tail=50
              exit 1
            fi
            
            # Check public endpoint
            if curl -f https://test.bachelorproject26.site/health; then
              echo "✅ Public API health check passed!"
            else
              echo "❌ Public API health check failed!"
              docker logs bpr-cloudflared --tail=50
              exit 1
            fi
      
      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "API available at: https://test.bachelorproject26.site"
          else
            echo "❌ Deployment failed!"
          fi