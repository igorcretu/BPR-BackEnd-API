# Cloudflare Tunnel Configuration Example
# Save this as: ~/.cloudflared/config.yml on your Raspberry Pi

# Replace TUNNEL_ID with your actual tunnel ID
# Get it from: cloudflared tunnel list
tunnel: TUNNEL_ID

# Replace TUNNEL_ID in the credentials file path
credentials-file: /home/pi/.cloudflared/TUNNEL_ID.json

ingress:
  # Route your API domain to the backend service
  # Replace api.yourdomain.com with your actual domain
  - hostname: api.yourdomain.com
    service: http://localhost:5000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      # Optional: Add headers
      httpHostHeader: api.yourdomain.com
  
  # Catch-all rule (required) - must be last
  - service: http_status:404

# Optional: Logging configuration
# Uncomment to enable detailed logging
# loglevel: info
# logfile: /var/log/cloudflared.log

# Optional: Metrics
# metrics: localhost:9090
