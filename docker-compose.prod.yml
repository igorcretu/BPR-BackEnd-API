version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: bpr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_prediction}
      POSTGRES_USER: ${POSTGRES_USER:-bpr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"  # Expose for local database tools
    networks:
      - bpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpr_user} -d ${POSTGRES_DB:-car_prediction}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend (from GitHub Container Registry)
  backend:
    image: ghcr.io/igorcretu/bpr-backend:latest
    container_name: bpr-flask
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: app.main
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bpr_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-car_prediction}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      PREDICTION_QUEUE_MODE: ${PREDICTION_QUEUE_MODE:-hybrid}
      PREDICTION_QUEUE_THRESHOLD: ${PREDICTION_QUEUE_THRESHOLD:-5}
      PREDICTION_QUEUE_PRIORITY_DEFAULT: ${PREDICTION_QUEUE_PRIORITY_DEFAULT:-100}
    # Don't expose to host - only accessible through Cloudflare Tunnel
    ports:
      - "5000:5000"
    networks:
      - bpr-network
    volumes:
      # Mount ML models directory
      - ./app/models:/app/app/models
      - ./logs:/app/logs
      # TEMPORARY: Mount specific files for hotfixes
      - ./app/main.py:/app/app/main.py
      - ./app/ml/predictor.py:/app/app/ml/predictor.py
      - ./app/ml/ml_utils.py:/app/app/ml/ml_utils.py
      # Mount images directory from ML-Model project
      - ../BPR-BackEnd-ML-Model/bilbasen_scrape/images:/app/images
      # Mount CSV data directory for imports and scraper logs
      - ../BPR-BackEnd-ML-Model/bilbasen_scrape:/app/data
      # Mount ML-Model scripts directory for scraper and training execution
      - ../BPR-BackEnd-ML-Model:/app/ML_Model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prediction-worker:
    image: ghcr.io/igorcretu/bpr-backend:latest
    container_name: bpr-prediction-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: app.main
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bpr_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-car_prediction}
      SECRET_KEY: ${SECRET_KEY}
      PREDICTION_QUEUE_MODE: ${PREDICTION_QUEUE_MODE:-hybrid}
      PREDICTION_QUEUE_THRESHOLD: ${PREDICTION_QUEUE_THRESHOLD:-5}
      PREDICTION_QUEUE_PRIORITY_DEFAULT: ${PREDICTION_QUEUE_PRIORITY_DEFAULT:-100}
      PREDICTION_QUEUE_POLL_INTERVAL: ${PREDICTION_QUEUE_POLL_INTERVAL:-1.5}
      PREDICTION_QUEUE_MAX_ATTEMPTS: ${PREDICTION_QUEUE_MAX_ATTEMPTS:-3}
    command: ["python", "-m", "app.worker"]
    networks:
      - bpr-network
    volumes:
      # Mount ML models directory
      - ./app/models:/app/app/models
      - ./logs:/app/logs
      # TEMPORARY: Mount specific files for hotfixes
      - ./app/main.py:/app/app/main.py
      - ./app/ml/predictor.py:/app/app/ml/predictor.py
      - ./app/ml/ml_utils.py:/app/app/ml/ml_utils.py
      # Mount ML-Model scripts directory
      - ../BPR-BackEnd-ML-Model:/app/ML_Model

volumes:
  postgres_data:
    driver: local

networks:
  bpr-network:
    driver: bridge