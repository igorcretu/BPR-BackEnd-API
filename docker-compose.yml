version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: bpr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_prediction}
      POSTGRES_USER: ${POSTGRES_USER:-bpr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpr_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - bpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpr_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpr-flask
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: app.main
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bpr_user}:${POSTGRES_PASSWORD:-bpr_password}@db:5432/${POSTGRES_DB:-car_prediction}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      PREDICTION_QUEUE_MODE: ${PREDICTION_QUEUE_MODE:-hybrid}
      PREDICTION_QUEUE_THRESHOLD: ${PREDICTION_QUEUE_THRESHOLD:-5}
      PREDICTION_QUEUE_PRIORITY_DEFAULT: ${PREDICTION_QUEUE_PRIORITY_DEFAULT:-100}
    ports:
      - "5000:5000"
    networks:
      - bpr-network
    volumes:
      # Mount models from app/models directory
      - ./app/models:/app/app/models
      - ./logs:/app/logs
      # For development: mount source code
      - ./app:/app/app
      # Mount images directory from ML-Model project
      - ../BPR-BackEnd-ML-Model/bilbasen_scrape/images:/app/images
      # Mount CSV data for import (optional)
      - ../BPR-BackEnd-ML-Model/bilbasen_scrape:/app/data
      # Mount ML-Model scripts directory for scraper and training execution
      - ../BPR-BackEnd-ML-Model:/app/ML_Model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prediction-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpr-prediction-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: app.main
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bpr_user}:${POSTGRES_PASSWORD:-bpr_password}@db:5432/${POSTGRES_DB:-car_prediction}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      PREDICTION_QUEUE_MODE: ${PREDICTION_QUEUE_MODE:-hybrid}
      PREDICTION_QUEUE_THRESHOLD: ${PREDICTION_QUEUE_THRESHOLD:-5}
      PREDICTION_QUEUE_PRIORITY_DEFAULT: ${PREDICTION_QUEUE_PRIORITY_DEFAULT:-100}
      PREDICTION_QUEUE_POLL_INTERVAL: ${PREDICTION_QUEUE_POLL_INTERVAL:-1.5}
      PREDICTION_QUEUE_MAX_ATTEMPTS: ${PREDICTION_QUEUE_MAX_ATTEMPTS:-3}
    command: ["python", "-m", "app.worker"]
    networks:
      - bpr-network
    volumes:
      # Mount models from app/models directory
      - ./app/models:/app/app/models
      - ./logs:/app/logs
      - ./app:/app/app
      # Mount ML-Model scripts directory
      - ../BPR-BackEnd-ML-Model:/app/ML_Model

volumes:
  postgres_data:

networks:
  bpr-network:
    driver: bridge
